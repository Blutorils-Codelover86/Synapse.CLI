[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "synapse"
version = "0.1.0"
description = "Local-first semantic coding universe visualization"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.9.0",
    "sqlalchemy>=2.0.0",
    "rich>=13.0.0",
]

[project.scripts]
synapse = "synapse.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse"]
